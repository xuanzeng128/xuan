<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品介紹｜那年青春，我們走進的古蹟</title><meta name="description" content="以青春故事連結臺中地方文化的行銷影展專題。"><meta name="keywords" content="行銷影展,文化深耕,地方創生"><meta name="author" content="曾苡瑄"><meta name="robots" content="index,follow"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/rwd.css"></head><body><header class="top"><a href="index.html">映・青春 <small>FILM PROJECT</small></a><button class="toggle" aria-label="切換導覽列">☰</button><nav><a href="index.html">首頁</a><a href="project.html">作品介紹</a><a href="story.html">故事與場景</a><a href="team.html">製作團隊</a></nav></header><div class="wrap"><main><h1>作品介紹</h1><section class="card"><h2>創作理念</h2><p>《那年青春，我們走進的古蹟》以兩位女孩的高中暑假回憶為主軸。成年後的女主角在火車上翻看相簿，回想起當年與朋友走訪臺中文學館及臺中驛鐵道文化園區的時光。古蹟不只是被保存的建築，也能成為人們相遇、探索、留下記憶的生活場景。</p></section><section class="card"><h2>主題連結</h2><p><b>文化深耕：</b>透過場景探索認識地方文化與歷史空間。</p><p><b>地方創生：</b>以青年視角重新看見舊城區，讓文化場域與當代生活產生連結。</p></section></main><aside class="card"><h2>專題資訊</h2><p>主題：文化深耕 × 地方創生</p><p>年度：2026</p></aside></div><footer>行銷影展專題｜2026</footer><script src="js/nav.js" defer></script></body></html>
